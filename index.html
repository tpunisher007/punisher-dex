<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Punisher DEX | Stablecoin Transfer</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="bg-blur blur1"></div>
<div class="bg-blur blur2"></div>

<header>

<div class="logo">
PUNISHER <span>DEX</span>
</div>

<nav>

<a href="#">Home</a>
<a href="#">Markets</a>
<a href="#">Transfer</a>
<a href="#">Portfolio</a>
<a href="#">Roadmap</a>

</nav>

<button id="walletBtn">
Connect Wallet
</button>

</header>

<section class="hero">

<div class="hero-left">

<h1>
Send <span>USDC</span> & <span>EURC</span>
Across the Arc Ecosystem
</h1>

<p>

Fast demo interface for stablecoin transfers.
Built while exploring the Arc ecosystem.

</p>

<div class="hero-buttons">

<button class="primary">
Launch Transfer
</button>

<button class="secondary">
View Docs
</button>

</div>

</div>

<div class="hero-right">

<div class="transfer-card">

<h2>
Send Stablecoins
</h2>

<label>
Recipient Address
</label>

<input
type="text"
placeholder="0x..."
id="receiver"
/>

<label>
Select Token
</label>

<select id="token">

<option>
USDC
</option>

<option>
EURC
</option>

</select>

<label>
Amount
</label>

<input
type="number"
placeholder="0.00"
id="amount"
/>

<label>
Network
</label>

<select id="network">

<option>
Arc
</option>
<div class="fee-box">

<div class="fee-row">
<span>Network</span>
<span>Arc</span>
</div>

<div class="fee-row">
<span>Estimated Fee</span>
<span>0.0002 ARC</span>
</div>

<div class="fee-row">
<span>Estimated Time</span>
<span>~2 sec</span>
</div>

</div>

<div class="preview-card">

<h3>Transaction Preview</h3>

<div class="preview-row">
<span>Recipient</span>
<span id="previewAddress">
Not entered
</span>
</div>

<div class="preview-row">
<span>Token</span>
<span id="previewToken">
USDC
</span>
</div>

<div class="preview-row">
<span>Amount</span>
<span id="previewAmount">
0.00
</span>
</div>

<div class="preview-row">
<span>Status</span>
<span class="pending">
Ready
</span>
</div>

</div>

<button id="sendBtn">
Send Token
</button>

<p class="demo-note">
Demo interface only. No blockchain transaction will be executed.
</p>

</div>

</div>

</section>

<section class="features">

<h2>
Why Punisher DEX?
</h2>

<div class="feature-grid">

<div class="feature-card">
<h3>⚡ Fast Transfers</h3>
<p>
Transfer stablecoins with a simple and clean interface.
</p>
</div>

<div class="feature-card">
<h3>🔐 Secure Wallet UI</h3>
<p>
Designed for future wallet integration and secure signing.
</p>
</div>

<div class="feature-card">
<h3>🌍 Cross Border Payments</h3>
<p>
Prototype for global USDC and EURC transfers.
</p>
</div>

<div class="feature-card">
<h3>📊 Live Portfolio</h3>
<p>
Track balances and transaction history in one place.
</p>
</div>

</div>

</section>

<section class="stats">

<h2>
Network Overview
</h2>

<div class="stats-grid">

<div class="stat-card">
<h3>Supported Tokens</h3>
<p>USDC • EURC</p>
</div>

<div class="stat-card">
<h3>Network</h3>
<p>Arc</p>
</div>

<div class="stat-card">
<h3>Status</h3>
<p>Demo Mode</p>
</div>

<div class="stat-card">
<h3>Wallet</h3>
<p>Coming Soon</p>
</div>

</div>

</section>
  <section class="roadmap">

<h2>Roadmap</h2>

<div class="roadmap-grid">

<div class="roadmap-card">
<h3>Phase 1</h3>
<p>Responsive UI</p>
</div>

<div class="roadmap-card">
<h3>Phase 2</h3>
<p>Wallet Connection</p>
</div>

<div class="roadmap-card">
<h3>Phase 3</h3>
<p>USDC / EURC Transfers</p>
</div>

<div class="roadmap-card">
<h3>Phase 4</h3>
<p>Smart Contract Integration</p>
</div>

</div>

</section>

<footer>

<div class="footer-content">

<div>

<p>
